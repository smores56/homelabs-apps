apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanobot
  labels:
    app.kubernetes.io/name: nanobot
    app.kubernetes.io/component: agent
spec:
  # One writer on one ReadWriteOnce scratch volume: never run two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nanobot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanobot
        app.kubernetes.io/component: agent
    spec:
      # A gVisor ring is the sandbox boundary for everything the agent runs.
      runtimeClassName: gvisor
      # platform owns the ServiceAccount and this repo may not contain one.
      serviceAccountName: nanobot
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # The human's uid owns every host share, so the pod writes as the human
        # does: Calibre and the OPDS server read the EPUBs with no per-share
        # translation layer. OnRootMismatch makes the fsGroup pass a no-op after
        # the first mount, so a restart never walks the books tree.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The env roots are directories inside mounted volumes, and Kubernetes
      # mounts a volume empty: nothing creates /data/tmp, and a subPath mount
      # would create it root-owned, unwritable by uid 1000. This one-shot step
      # makes the layout before the agent starts; it is idempotent.
      initContainers:
        - name: prepare-tools
          # Only mkdir runs here, but it is the same digest-pinned image the
          # container below runs: the Flux marker rewrites that line alone, so a
          # digest bump moves both.
          image: ghcr.io/smores56/homelabs-platform/nanobot@sha256:01a32bece3833808aa9e4d6f9527113232bbf6ff0a01665b1e865943d1e726e8 # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          command:
            - mkdir
            - -p
            - /data/tmp
            - /data/home/tools/bin
            - /data/home/tools/uv
            - /data/home/tools/py
            - /data/home/tools/npm
            - /data/home/tools/cargo
            - /data/home/tools/go
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scratch
              mountPath: /data
            - name: tools
              mountPath: /data/home/tools
      containers:
        - name: nanobot
          # Built and published by the trusted workflow in homelabs-platform;
          # the image source and its digest are platform-owned. Flux rewrites
          # The digest from ImagePolicy flux-system:nanobot, so the marked line
          # below it is the only image Flux rewrites and a hand-typed digest is a
          # bug that the next reconcile reverts. The prepare-tools init container
          # repeats this digest and is not marked: a bump has to move both.
          # {"$imagepolicy": "flux-system:nanobot"}
          image: ghcr.io/smores56/homelabs-platform/nanobot@sha256:01a32bece3833808aa9e4d6f9527113232bbf6ff0a01665b1e865943d1e726e8 # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - --foreground
            # The probe and the tunnel both address 8080; the gateway's own
            # default is not this port.
            - --port
            - "8080"
          ports:
            # Health/gateway API; the probes use this one.
            - name: http
              containerPort: 8080
              protocol: TCP
            # WebUI and websocket channel; the Service and the tunnel use this.
            - name: ui
              containerPort: 8765
              protocol: TCP
          env:
            # The image renders $HOME/.nanobot/config.json from this tree.
            - name: NANOBOT_CONFIG_DIR
              value: /etc/nanobot
            # State lives on the scratch PVC; the image rootfs is read-only.
            - name: HOME
              value: /data/home
            # The library is the existing books share, not a copy: nanobot
            # writes an EPUB there and Calibre/OPDS sees it immediately.
            - name: BOOK_SHELF
              value: /data/books
            # Temp files are the installers' scratch space (pip, npm, cargo
            # all unpack there), so they belong on the tools PVC's sibling
            # scratch volume, not on the 64Mi memory emptyDir: a build that
            # fills 64Mi is evicted, and the emptyDir dies with the pod.
            - name: TMPDIR
              value: /data/tmp
            # The broker is the only place a credential exists and the only
            # reachable internal service. It is an HTTP API, not a forward
            # proxy: every request is $BROKER_URL/<logical-host>/<path>, and no
            # request carries a token.
            - name: BROKER_URL
              value: http://broker.broker.svc.cluster.local:8080
            - name: TINYFISH_BASE_URL
              value: http://broker.broker.svc.cluster.local:8080/tinyfish
            # A git push that would prompt is a bug: there is no password.
            - name: GIT_TERMINAL_PROMPT
              value: "0"
            # Toolchain roots on nanobot-tools (see pvc.yaml for the trust
            # boundary). Every installer is pointed here so an install survives
            # a restart and a fresh image; /opt/nanobot/bin stays on PATH because
            # it holds the image's interpreter and the entrypoint execs `nanobot`.
            - name: PATH
              value: /data/home/tools/bin:/opt/nanobot/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: UV_TOOL_DIR
              value: /data/home/tools/uv
            - name: UV_TOOL_BIN_DIR
              value: /data/home/tools/bin
            - name: PIP_USER
              value: "1"
            - name: PYTHONUSERBASE
              value: /data/home/tools/py
            - name: NPM_CONFIG_PREFIX
              value: /data/home/tools/npm
            - name: CARGO_HOME
              value: /data/home/tools/cargo
            - name: GOPATH
              value: /data/home/tools/go
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            # The tenant ConfigMap is projected as two directory mounts. One
            # mount at /etc/nanobot would make the policy subPath targets
            # nested mounts, and kubelet pre-creates a nested mountpoint as a
            # directory (kubernetes#121294), so the file bind would fail.
            - name: skills
              mountPath: /etc/nanobot/skills
              readOnly: true
            - name: cron
              mountPath: /etc/nanobot/cron
              readOnly: true
            # platform-owned prompt and model catalog, pinned by admission to
            # these two paths, so a tenant push cannot shadow them.
            - name: nanobot-policy
              mountPath: /etc/nanobot/prompts/system.md
              subPath: system.md
              readOnly: true
            - name: nanobot-policy
              mountPath: /etc/nanobot/models/providers.yaml
              subPath: providers.yaml
              readOnly: true
            # /data first, then the books share and the toolchain nested inside
            # it.
            - name: scratch
              mountPath: /data
            - name: books
              mountPath: /data/books
            - name: tools
              mountPath: /data/home/tools
            # Kept for the programs that hardcode /tmp instead of reading
            # TMPDIR; the rootfs is read-only, so without it they fail outright.
            - name: tmp
              mountPath: /tmp
      volumes:
        # One ConfigMap, two projections: skills and cron are the tenant-owned
        # half of the config tree.
        - name: skills
          configMap:
            name: nanobot-config
            items:
              - key: skill-broker-requests.md
                path: broker-requests/SKILL.md
              - key: skill-git-change.md
                path: git-change/SKILL.md
              - key: skill-tinyfish-search.md
                path: tinyfish-search/SKILL.md
        - name: cron
          configMap:
            name: nanobot-config
            items:
              - key: cron-weekly-review.yaml
                path: weekly-review.yaml
        # Created by homelabs-platform, never by this repository.
        - name: nanobot-policy
          configMap:
            name: nanobot-policy
            items:
              - key: system.md
                path: system.md
              - key: providers.yaml
                path: providers.yaml
        - name: books
          persistentVolumeClaim:
            claimName: nanobot-books
        - name: scratch
          persistentVolumeClaim:
            claimName: nanobot-scratch
        - name: tools
          persistentVolumeClaim:
            claimName: nanobot-tools
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 30
