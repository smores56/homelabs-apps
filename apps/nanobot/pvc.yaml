apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanobot-scratch
  labels:
    app.kubernetes.io/name: nanobot
    app.kubernetes.io/component: agent
spec:
  # Scratch only: sessions, outbox and render cache. No app data ever lands here.
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanobot-books
  labels:
    app.kubernetes.io/name: nanobot
    app.kubernetes.io/component: books
spec:
  # The existing books share, not a copy: platform owns the pre-bound PV
  # `nanobot-books-data` (local path /mnt/data/books), the same tree Calibre and
  # the OPDS server read. The class must be stated: k3s's default local-path
  # class would otherwise provision a new empty volume and leave the PV unused.
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: data-local
  resources:
    requests:
      storage: 5Ti
---
# Trust boundary, reviewed as one: everything on this volume was installed at
# runtime by the agent, so it persists unverified across restarts. gVisor
# contains a kernel escape from a compromised process; it does not contain a
# malicious package, which runs as uid 1000 with the agent's network, broker and
# push reach. Nothing here is reproducible from the digest-pinned image, so a
# wipe is the reset: delete the claim, Flux recreates it empty, and the agent
# reinstalls only the tools a task actually needs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanobot-tools
  labels:
    app.kubernetes.io/name: nanobot
    app.kubernetes.io/component: agent
spec:
  # The default local-path class, like nanobot-scratch: no pre-bound PV, and no
  # app data ever lands here.
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 5Gi
