# A cron entry: the image's scheduler reads every file in this directory. Times
# are UTC, matching the pod clock.
name: cluster-digest
schedule: "0 7 * * *"
enabled: true
model: deepseek-v4.1-flash
prompt: |
  Report on this repository and the cluster state it produces, using only what
  Git and the broker show you: the last 24 hours of commits to main, whether
  scripts/verify.sh passes at HEAD, the newest image digests, and anything in
  the manifests that is stale (a pinned cycle, an unmounted volume, a policy
  rule with no matching workload). Write findings, not narrative. Never fetch
  application data or logs.
delivery:
  kind: file
  path: /data/outbox/cluster-digest.md
  retention_days: 14
