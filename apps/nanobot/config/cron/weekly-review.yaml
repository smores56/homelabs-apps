# Weekly: keep the tenant honest rather than busy. An empty report is the goal.
name: weekly-review
schedule: "0 8 * * 1"
enabled: true
# Must equal models.default: nanobot 0.4.1 has no per-job override, and the
# renderer refuses a job that claims another model.
model: deepseek-v4.1-flash
prompt: |
  Review this repository as its reviewer: is every image digest still
  resolvable, does every NetworkPolicy rule still have a consumer, are the
  ConfigMap items and the Deployment's mount list still in sync, and does
  AGENTS.md still describe the tree? Propose at most three commits, one concern
  each, and list anything that needs a human because it is cluster-scoped, a
  Secret, or touches a data namespace.

  Then publish one notification through the notify skill, but only when the
  report is not empty: the number of proposed commits and anything that needs a
  human, priority `default` for proposals and `high` when something is blocked.
  An empty report sends nothing — the file is the record, the notification is
  the delivery.
delivery:
  kind: file
  path: /data/outbox/weekly-review.md
  retention_days: 30
