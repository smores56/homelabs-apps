apiVersion: v1
kind: Service
metadata:
  name: nanobot
  labels:
    app.kubernetes.io/name: nanobot
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nanobot
  ports:
    # The tunnel enters on 80 and lands on the WebUI/websocket listener; the
    # gateway's health listener (8080) never needs Service exposure.
    - name: ui
      port: 80
      targetPort: 8765
      protocol: TCP
