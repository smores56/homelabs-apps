apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The platform's tenant Kustomization targets this namespace, and the tenant
# ServiceAccount is bound only there.
namespace: tenant-apps
# Selectors stay literal so a label edit never orphans a running pod.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: nanobot
resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
# `namespace.yaml` and `networkpolicy.yaml` are deliberately absent: the
# Namespace is cluster-scoped, and NetworkPolicies are platform-owned so the
# tenant cannot widen its own isolation (the tenant Role denies them). Both
# files are the reviewed contract the live objects must match.
configMapGenerator:
  - name: nanobot-config
    options:
      labels:
        app.kubernetes.io/component: config
    files:
      # Flat ConfigMap keys; the Deployment maps each one onto its mount path.
      - system-prompt.md=config/prompts/system.md
      - providers.yaml=config/models/providers.yaml
      - cron-weekly-review.yaml=config/cron/weekly-review.yaml
      - skill-broker-requests.md=config/skills/broker-requests/SKILL.md
      - skill-git-change.md=config/skills/git-change/SKILL.md
      - skill-tinyfish-search.md=config/skills/tinyfish-search/SKILL.md
