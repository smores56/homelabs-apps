apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The platform's tenant Kustomization targets this namespace, and the tenant
# ServiceAccount is bound only there.
namespace: tenant-apps
# Selectors stay literal so a label edit never orphans a running pod.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: nanobot
resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml

# The image pin has one source of truth here. Flux rewrites the three marked
# fields, and kustomize renders `repo:build-<n>@sha256:...` into every occurrence
# (the agent container and the prepare-tools init container).
images:
  - name: ghcr.io/smores56/homelabs-platform/nanobot
    newName: ghcr.io/smores56/homelabs-platform/nanobot # {"$imagepolicy": "flux-system:nanobot:name"}
    newTag: build-5 # {"$imagepolicy": "flux-system:nanobot:tag"}
    digest: sha256:1f4f88f667f676ec68418e4054470286ba222ea02d447306c4cf6f154225a3e3 # {"$imagepolicy": "flux-system:nanobot:digest"}
# `namespace.yaml` and `networkpolicy.yaml` are deliberately absent: the
# Namespace is cluster-scoped, and NetworkPolicies are platform-owned so the
# tenant cannot widen its own isolation (the tenant Role denies them). Both
# files are the reviewed contract the live objects must match.
configMapGenerator:
  - name: nanobot-config
    options:
      labels:
        app.kubernetes.io/component: config
    files:
      # Only the tenant-owned half. The prompt and the model catalog come from
      # platform's nanobot-policy ConfigMap (see deployment.yaml).
      - cron-weekly-review.yaml=config/cron/weekly-review.yaml
      - skill-broker-requests.md=config/skills/broker-requests/SKILL.md
      - skill-git-change.md=config/skills/git-change/SKILL.md
      - skill-tinyfish-search.md=config/skills/tinyfish-search/SKILL.md
