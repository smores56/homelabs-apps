name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify
        run: |
          nix shell nixpkgs#kustomize nixpkgs#kubeconform nixpkgs#yamllint \
            nixpkgs#shellcheck -c bash scripts/verify.sh
