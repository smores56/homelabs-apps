---
extends: default

ignore: |
  .git/

rules:
  # The Flux digest marker alone is ~44 columns on a 71-character digest;
  # 132 keeps the marker inline, which is the only form the setter accepts.
  line-length:
    max: 132
    level: error
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  braces:
    max-spaces-inside: 1
  key-duplicates: enable
